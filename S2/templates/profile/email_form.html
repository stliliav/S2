<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Trirong">
    <style>
        body {
            font-family: 'Trirong', serif;
            color: rgb(111, 60, 2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
        form { width: 100%; max-width: 350px; }
        input {
            font-family: 'Trirong', serif !important;
            font-size: 22px !important;
            color: rgb(111, 60, 2) !important;
            border: 2px solid green !important;
            border-radius: 8px !important;
            padding: 10px !important;
            margin: 10px auto !important;
            display: block;
            width: 100%;
            box-sizing: border-box;
        }
        input[type="submit"] { background-color: green; color: white !important; }
    </style>
</head>
<body>

    <h2>{{ title }}</h2>

    <form action="" method="post" enctype="multipart/form-data">
        {{ form.hidden_tag() }}

        <div>
            {{ form.email.label }}<br>
            {{ form.email() }}
            {% for error in form.email.errors %}
                <div>Error: {{ error }}</div>
            {% endfor %}
        </div>

        <br>
        <div>
            {{ form.submit() }}
        </div>
    </form>

</body>
</html>
