<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
</head>
<body>
    <form action="" method="post">
        {{ form.hidden_tag() }}
        <div>
            {{ form.text.label}}<br>
            {{ form.text() }}

            {% for error in form.text.errors %}
                <div>Error: {{ error }}</div>
            {% endfor %}
        </div>
        <br>
        <div>
            {{ form.submit() }}
        </div>
    </form>

    <br>

</body>
</html>
