<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Trirong">
</head>
<body style="margin: 20px;">
    <div style="display: flex; align-items: flex-start;">

        <div style="display: flex; flex-direction: column; align-items: flex-start; text-align: center; ">
            <img src="{{ url_for('static', filename='images/pfp.png') }}"
                 alt="Account"
                 width="250"
                 height="auto"
                 style="display: block;">

            <div style="position: relative; font-family: 'Outfit', sans-serif; font-weight: 400; font-size: 32px; color: rgb(85, 201, 46); line-height: 1;">
                <br>
                Age: <span style="font-family: 'Outfit', sans-serif; font-weight: 400; font-size: 32px; color: rgb(84, 84, 84); line-height: 1;"> {{user.profile.age}}</span>
            </div>

            <div style="position: relative; font-family: 'Outfit', sans-serif; font-weight: 400; font-size: 32px; color: rgb(85, 201, 46); line-height: 1;">
                Email: <span style="font-family: 'Outfit', sans-serif; font-weight: 400; font-size: 32px; color: rgb(84, 84, 84); line-height: 1;"> {{user.email}} </span>

            </div>
            <br>
            <br>

            <a href="{{ url_for('edit_username', uid = user.id) }}"
               style="display: block; text-align: left; font-family: 'Trirong', serif; font-size: 32px; margin-top: 10px; color: rgb(111, 60, 2)">Edit username</a>

            <a href="{{ url_for('edit_email', uid = user.id) }}"
               style="display: block; text-align: left; font-family: 'Trirong', serif; font-size: 32px; margin-top: 10px; color:  rgb(111, 60, 2)">Edit email</a>

            <a href="{{ url_for('edit_password', uid = user.id) }}"
               style="display: block; text-align: left; font-family: 'Trirong', serif; font-size: 32px; margin-top: 10px; color:  rgb(111, 60, 2)">Edit password</a>

            <a href="{{ url_for('logout', uid = user.id) }}"
               style="display: block; text-align: left; font-family: 'Trirong', serif; font-size: 32px; margin-top: 10px; color: rgb(255,0,0)">Log out</a>

        </div>

        <div style="margin-left: 50px; display: flex; flex-direction: column;">
            <span style="font-family: 'Outfit', sans-serif; font-weight: 400; font-size: 90px; color: rgb(85, 201, 46); line-height: 1;">
                {{user.profile.name}}
            </span>
            <span style="font-family: 'Noto Serif', serif; font-weight: 200; font-size: 32px; color: rgb(84, 84, 84); line-height: 1;">
                @{{user.username}}
            </span>
            <br>
        </div>

    </div>

</body>
</html>
