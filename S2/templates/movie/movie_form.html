<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Trirong">
    <style>
        body {
            font-family: 'Trirong', serif;
            color: rgb(111, 60, 2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
        form { width: 100%; max-width: 400px; padding: 10px; }
        input, select, textarea {
            font-family: 'Trirong', serif !important;
            font-size: 18px !important;
            color: rgb(111, 60, 2) !important;
            border: 2px solid green !important;
            border-radius: 8px !important;
            padding: 8px !important;
            margin: 5px auto !important;
            display: block;
            width: 100%;
            box-sizing: border-box;
        }
        input::placeholder { color: gray !important; }
        input[type="submit"] {
            background-color: green;
            color: white !important;
            cursor: pointer;
            margin-top: 15px !important;
        }
        a { color: rgb(111, 60, 2); text-decoration: none; font-size: 16px; }
        .error { color: red; font-size: 14px; }
    </style>
</head>
<body>
    <h2>{{ title }}</h2>
    <form action="" method="post" enctype="multipart/form-data">
        {{ form.hidden_tag() }}
        {{ form.title(placeholder="Title") }}
        {{ form.country(placeholder="Country") }}
        {{ form.year(placeholder="Year of publishing") }}
        {{ form.genres(placeholder="Genres") }}
        <div style="font-size: 14px;">{{ form.img.label }}</div>
        {{ form.img() }}
        {{ form.submit() }}
    </form>
    <a href="{{ url_for('home') }}">Back to the post list</a>
</body>
</html>
