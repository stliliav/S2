{% extends "comment/comment_form.html" %}

{% block content %}
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Trirong">
    <style>
        .info-container {
            text-align: center;
            font-family: 'Trirong', serif;
            color: rgb(111, 60, 2);
            max-width: 500px;
            margin: 0 auto;
        }

        .delete-btn {
            font-family: 'Trirong', serif !important;
            background-color: #8b0000;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            transition: 0.3s;
            margin-top: 10px;
        }

        .delete-btn:hover {
            background-color: #a00000;
        }

        hr {
            border: 0;
            height: 1px;
            background: #ccc;
            margin: 20px 0;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: rgb(111, 60, 2);
            text-decoration: none;
            font-size: 18px;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>

    <div class="info-container">
        {{ super() }}

        <hr>

        <form action="{{ url_for('delete_comment', cid=cid) }}" method="POST" style="display:inline;">
            <button type="submit" class="delete-btn" onclick="return confirm('Are you sure?')">
                Delete Comment
            </button>
        </form>

        <br>
        <a href="{{ url_for('movie_detail', mid=mid) }}" class="back-link">
            Back to the comment list
        </a>
    </div>
{% endblock %}
