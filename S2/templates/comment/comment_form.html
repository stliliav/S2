<body>
    {% block content %}
    <form action="" method="post">
        {{ form.hidden_tag() }}
        <div>
            {{ form.text.label }}<br>
            {{ form.text() }}

            {% for error in form.text.errors %}
                <div>Error: {{ error }}</div>
            {% endfor %}
        </div>
        <br>
        <div>
            {{ form.submit() }}
        </div>
    </form>
    {% endblock %}
</body>
